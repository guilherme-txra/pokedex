<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="shortcut icon" href="/image/icon.png" type="image/x-icon" style="width: auto;">

    <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
    <header class="menu-container">
        <img class="logo" src="/image/logo.png" alt="">
        
        <div class="menu-bar">    
            <ul class="menu">
                <li><a href="#"><img src="/image/home.png" alt=""></a></li>
                <li><a href="#"><img src="/image/star.png" alt=""></a></li>
            </ul>
            <div class="search-bar">
                <input id="pokemonName" type="text" placeholder="...">
                <button id="search" onclick="fetchApi()">
                    <img src="/image/lupa.png" alt="">
                </button>
            </div>     
        </div>
    </header>

    <div class="card-container">
        <div class="card">
            <img src="" class="pokemonSprite">
            <div class="content"></div>
        </div>
    </div>    


    <script src="scripts/script.js"></script>
</body>
</html>
